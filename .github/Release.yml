name: Build & Publish Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-release:
    name: Build Android Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create GitHub releases and upload assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Optional: Decode Keystore from GitHub Secrets if you have configured signing
      # Base64 string stored in secrets.KEYSTORE_BASE64
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Build Release APK and Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare Artifacts
        id: prepare_artifacts
        run: |
          # Find APK and AAB outputs
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            ${{ steps.prepare_artifacts.outputs.aab_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            ${{ steps.prepare_artifacts.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          
